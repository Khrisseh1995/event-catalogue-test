.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Consume events\nfor message in consumer:\n    event_data = json.loads(message.value)\n    print(f\&quot;Received Inventory Adjusted event: {event_data}\&quot;)\n```\n\n&lt;Footer /&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/events/InventoryAdjusted/index.mdx&quot;],&quot;digest&quot;:[0,&quot;4fa7f4e32202c86d&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;events&quot;],&quot;slug&quot;:[0,&quot;inventoryadjusted&quot;],&quot;render&quot;:[0,null]}],&quot;source&quot;:[0,{&quot;id&quot;:[0,&quot;InventoryAdjusted/index.mdx&quot;],&quot;data&quot;:[0,{&quot;channels&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;version&quot;:[0,&quot;latest&quot;]}]]],&quot;id&quot;:[0,&quot;InventoryAdjusted&quot;],&quot;name&quot;:[0,&quot;Inventory adjusted&quot;],&quot;summary&quot;:[0,&quot;Indicates a change in inventory level\n&quot;],&quot;version&quot;:[0,&quot;1.0.1&quot;],&quot;badges&quot;:[1,[[0,{&quot;content&quot;:[0,&quot;Recently updated!&quot;],&quot;backgroundColor&quot;:[0,&quot;green&quot;],&quot;textColor&quot;:[0,&quot;green&quot;]}],[0,{&quot;content&quot;:[0,&quot;Channel:Apache Kafka&quot;],&quot;backgroundColor&quot;:[0,&quot;yellow&quot;],&quot;textColor&quot;:[0,&quot;yellow&quot;]}]]],&quot;owners&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;dboyne&quot;]}],[0,{&quot;id&quot;:[0,&quot;msmith&quot;]}],[0,{&quot;id&quot;:[0,&quot;asmith&quot;]}],[0,{&quot;id&quot;:[0,&quot;full-stack&quot;]}],[0,{&quot;id&quot;:[0,&quot;mobile-devs&quot;]}]]],&quot;schemaPath&quot;:[0,&quot;schema.avro&quot;],&quot;pathToFile&quot;:[0,&quot;/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/domains/Orders/services/InventoryService/events/InventoryAdjusted/index.md&quot;]}],&quot;body&quot;:[0,&quot;import Footer from &#39;@catalog/components/footer.astro&#39;;\n\n## Overview\n\nThe `Inventory Adjusted` event is triggered whenever there is a change in the inventory levels of a product. This could occur due to various reasons such as receiving new stock, sales, returns, or manual adjustments by the inventory management team. The event ensures that all parts of the system that rely on inventory data are kept up-to-date with the latest inventory levels.\n\n&lt;Tiles &gt;\n    &lt;Tile icon=\&quot;UserGroupIcon\&quot; href=\&quot;/docs/teams/full-stack\&quot; title=\&quot;Contact the team\&quot; description=\&quot;Any questions? Feel free to contact the owners\&quot; /&gt;\n    &lt;Tile icon=\&quot;DocumentIcon\&quot; href={`/generated/events/Inventory/${frontmatter.id}/schema.avro`} title=\&quot;View the schema\&quot; description=\&quot;View the schema directly in your browser\&quot; /&gt;\n&lt;/Tiles&gt;\n\n## Architecture diagram\n\n&lt;NodeGraph /&gt;\n\n&lt;SchemaViewer file=\&quot;schema.json\&quot; title=\&quot;JSON Schema\&quot; maxHeight=\&quot;500\&quot; /&gt;\n\n## Payload example\n\nEvent example you my see being published.\n\n```json title=\&quot;Payload example\&quot;\n{\n  \&quot;Name\&quot;: \&quot;John Doe\&quot;,\n  \&quot;Age\&quot;: 30,\n  \&quot;Department\&quot;: \&quot;Engineering\&quot;,\n  \&quot;Position\&quot;: \&quot;Software Engineer\&quot;,\n  \&quot;Salary\&quot;: 85000.50,\n  \&quot;JoinDate\&quot;: \&quot;2024-01-15\&quot;\n}\n```\n\n## Schema (avro)\n\n&lt;Schema file=\&quot;schema.avro\&quot; title=\&quot;Inventory Adjusted Schema (avro)\&quot; /&gt;\n\n## Producing the Event\n\nTo produce an Inventory Adjusted event, use the following example Kafka producer configuration in Python:\n\n```python title=\&quot;Produce event in Python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nproducer = KafkaProducer(\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Event data\nevent_data = {\n  \&quot;event_id\&quot;: \&quot;abc123\&quot;,\n  \&quot;timestamp\&quot;: datetime.utcnow().isoformat() + &#39;Z&#39;,\n  \&quot;product_id\&quot;: \&quot;prod987\&quot;,\n  \&quot;adjusted_quantity\&quot;: 10,\n  \&quot;new_quantity\&quot;: 150,\n  \&quot;adjustment_reason\&quot;: \&quot;restock\&quot;,\n  \&quot;adjusted_by\&quot;: \&quot;user123\&quot;\n}\n\n# Send event to Kafka topic\nproducer.send(&#39;inventory.adjusted&#39;, event_data)\nproducer.flush()\n```\n\n### Consuming the Event\n\nTo consume an Inventory Adjusted event, use the following example Kafka consumer configuration in Python:\n\n```python title=\&quot;Consuming the event with python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaConsumer\nimport json\n\n# Kafka configuration\nconsumer = KafkaConsumer(\n    &#39;inventory.adjusted&#39;,\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    auto_offset_reset=&#39;earliest&#39;,\n    enable_auto_commit=True,\n    group_id=&#39;inventory_group&#39;,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Consume events\nfor message in consumer:\n    event_data = json.loads(message.value)\n    print(f\&quot;Received Inventory Adjusted event: {event_data}\&quot;)\n```\n\n&lt;Footer /&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/events/InventoryAdjusted/index.mdx&quot;],&quot;digest&quot;:[0,&quot;4fa7f4e32202c86d&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;events&quot;],&quot;slug&quot;:[0,&quot;inventoryadjusted&quot;],&quot;render&quot;:[0,null]}],&quot;channel&quot;:[0,{&quot;id&quot;:[0,&quot;inventory.{env}.events/index.mdx&quot;],&quot;data&quot;:[0,{&quot;address&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;protocols&quot;:[1,[[0,&quot;kafka&quot;]]],&quot;parameters&quot;:[0,{&quot;env&quot;:[0,{&quot;enum&quot;:[1,[[0,&quot;dev&quot;],[0,&quot;sit&quot;],[0,&quot;prod&quot;]]],&quot;description&quot;:[0,&quot;Environment to use&quot;]}]}],&quot;id&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;name&quot;:[0,&quot;Inventory Events Channel&quot;],&quot;summary&quot;:[0,&quot;Central event stream for all inventory-related events including stock updates, allocations, and adjustments\n&quot;],&quot;version&quot;:[0,&quot;1.0.0&quot;],&quot;owners&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;dboyne&quot;]}]]],&quot;pathToFile&quot;:[0,&quot;/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/channels/inventory.{env}.events/index.md&quot;]}],&quot;body&quot;:[0,&quot;### Overview\nThe Inventory Events channel is the central stream for all inventory-related events across the system. This includes stock level changes, inventory allocations, adjustments, and stocktake events. Events for a specific SKU are guaranteed to be processed in sequence when using productId as the partition key.\n\n&lt;ChannelInformation /&gt;\n\n### Publishing and Subscribing to Events\n\n#### Publishing Example\n```python\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nbootstrap_servers = [&#39;localhost:9092&#39;]\ntopic = f&#39;inventory.{env}.events&#39;\n\n# Create a Kafka producer\nproducer = KafkaProducer(\n    bootstrap_servers=bootstrap_servers,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Example inventory update event\ninventory_event = {\n    \&quot;eventType\&quot;: \&quot;STOCK_LEVEL_CHANGED\&quot;,\n    \&quot;timestamp\&quot;: datetime.utcnow().isoformat(),\n    \&quot;version\&quot;: \&quot;1.0\&quot;,\n    \&quot;payload\&quot;: {\n        \&quot;productId\&quot;: \&quot;PROD-456\&quot;,\n        \&quot;locationId\&quot;: \&quot;WH-123\&quot;,\n        \&quot;previousQuantity\&quot;: 100,\n        \&quot;newQuantity\&quot;: 95,\n        \&quot;changeReason\&quot;: \&quot;ORDER_FULFILLED\&quot;,\n        \&quot;unitOfMeasure\&quot;: \&quot;EACH\&quot;,\n        \&quot;batchInfo\&quot;: {\n            \&quot;batchId\&quot;: \&quot;BATCH-789\&quot;,\n            \&quot;expiryDate\&quot;: \&quot;2025-12-31\&quot;\n        }\n    },\n    \&quot;metadata\&quot;: {\n        \&quot;source\&quot;: \&quot;warehouse_system\&quot;,\n        \&quot;correlationId\&quot;: \&quot;inv-xyz-123\&quot;,\n        \&quot;userId\&quot;: \&quot;john.doe\&quot;\n    }\n}\n\n# Send the message - using productId as key for partitioning\nproducer.send(\n    topic, \n    key=inventory_event[&#39;payload&#39;][&#39;productId&#39;].encode(&#39;utf-8&#39;),\n    value=inventory_event\n)\nproducer.flush()\n\nprint(f\&quot;Inventory event sent to topic {topic}\&quot;)\n\n```\n\n### Subscription example\n\n```python\nfrom kafka import KafkaConsumer\nimport json\nfrom datetime import datetime\n\nclass InventoryEventConsumer:\n    def __init__(self):\n        # Kafka configuration\n        self.topic = f&#39;inventory.{env}.events&#39;\n        self.consumer = KafkaConsumer(\n            self.topic,\n            bootstrap_servers=[&#39;localhost:9092&#39;],\n            group_id=&#39;inventory-processor-group&#39;,\n            auto_offset_reset=&#39;earliest&#39;,\n            enable_auto_commit=False,\n            value_deserializer=lambda x: json.loads(x.decode(&#39;utf-8&#39;)),\n            key_deserializer=lambda x: x.decode(&#39;utf-8&#39;) if x else None\n        )\n\n    def process_event(self, event):\n        \&quot;\&quot;\&quot;Process individual inventory events based on type\&quot;\&quot;\&quot;\n        event_type = event.get(&#39;eventType&#39;)\n        \n        if event_type == &#39;STOCK_LEVEL_CHANGED&#39;:\n            self.handle_stock_level_change(event)\n        elif event_type == &#39;LOW_STOCK_ALERT&#39;:\n            self.handle_low_stock_alert(event)\n        # Add more event type handlers as needed\n\n    def handle_stock_level_change(self, event):\n        \&quot;\&quot;\&quot;Handle stock level change events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Stock level change detected for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;New quantity: {payload[&#39;newQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def handle_low_stock_alert(self, event):\n        \&quot;\&quot;\&quot;Handle low stock alert events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Low stock alert for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;Current quantity: {payload[&#39;currentQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def start_consuming(self):\n        \&quot;\&quot;\&quot;Start consuming messages from the topic\&quot;\&quot;\&quot;\n        try:\n            print(f\&quot;Starting consumption from topic: {self.topic}\&quot;)\n            for message in self.consumer:\n                try:\n                    # Process the message\n                    event = message.value\n                    print(f\&quot;Received event: {event[&#39;eventType&#39;]} for product: {event[&#39;payload&#39;][&#39;productId&#39;]}\&quot;)\n                    \n                    # Process the event\n                    self.process_event(event)\n                    \n                    # Commit the offset after successful processing\n                    self.consumer.commit()\n                    \n                except Exception as e:\n                    print(f\&quot;Error processing message: {str(e)}\&quot;)\n                    # Implement your error handling logic here\n                    # You might want to send to a DLQ (Dead Letter Queue)\n        \n        except Exception as e:\n            print(f\&quot;Consumer error: {str(e)}\&quot;)\n        finally:\n            # Clean up\n            self.consumer.close()\n\nif __name__ == \&quot;__main__\&quot;:\n    # Create and start the consumer\n    consumer = InventoryEventConsumer()\n    consumer.start_consuming()\n  ```&quot;],&quot;filePath&quot;:[0,&quot;src/content/channels/inventor ata = {\n  \&quot;event_id\&quot;: \&quot;abc123\&quot;,\n  \&quot;timestamp\&quot;: datetime.utcnow().isoformat() + &#39;Z&#39;,\n  \&quot;product_id\&quot;: \&quot;prod987\&quot;,\n  \&quot;adjusted_quantity\&quot;: 10,\n  \&quot;new_quantity\&quot;: 150,\n  \&quot;adjustment_reason\&quot;: \&quot;restock\&quot;,\n  \&quot;adjusted_by\&quot;: \&quot;user123\&quot;\n}\n\n# Send event to Kafka topic\nproducer.send(&#39;inventory.adjusted&#39;, event_data)\nproducer.flush()\n```\n\n### Consuming the Event\n\nTo consume an Inventory Adjusted event, use the following example Kafka consumer configuration in Python:\n\n```python title=\&quot;Consuming the event with python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaConsumer\nimport json\n\n# Kafka configuration\nconsumer = KafkaConsumer(\n    &#39;inventory.adjusted&#39;,\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    auto_offset_reset=&#39;earliest&#39;,\n    enable_auto_commit=True,\n    group_id=&#39;inventory_group&#39;,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Consume events\nfor message in consumer:\n    event_data = json.loads(message.value)\n    print(f\&quot;Received Inventory Adjusted event: {event_data}\&quot;)\n```\n\n&lt;Footer /&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/events/InventoryAdjusted/index.mdx&quot;],&quot;digest&quot;:[0,&quot;4fa7f4e32202c86d&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;events&quot;],&quot;slug&quot;:[0,&quot;inventoryadjusted&quot;],&quot;render&quot;:[0,null]}],&quot;source&quot;:[0,{&quot;id&quot;:[0,&quot;InventoryAdjusted/index.mdx&quot;],&quot;data&quot;:[0,{&quot;channels&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;version&quot;:[0,&quot;latest&quot;]}]]],&quot;id&quot;:[0,&quot;InventoryAdjusted&quot;],&quot;name&quot;:[0,&quot;Inventory adjusted&quot;],&quot;summary&quot;:[0,&quot;Indicates a change in inventory level\n&quot;],&quot;vers y_group&#39;,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Consume events\nfor message in consumer:\n    event_data = json.loads(message.value)\n    print(f\&quot;Received Inventory Adjusted event: {event_data}\&quot;)\n```\n\n&lt;Footer /&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/events/InventoryAdjusted/index.mdx&quot;],&quot;digest&quot;:[0,&quot;4fa7f4e32202c86d&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;events&quot;],&quot;slug&quot;:[0,&quot;inventoryadjusted&quot;],&quot;render&quot;:[0,null]}],&quot;channel&quot;:[0,{&quot;id&quot;:[0,&quot;inventory.{env}.events/index.mdx&quot;],&quot;data&quot;:[0,{&quot;address&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;protocols&quot;:[1,[[0,&quot;kafka&quot;]]],&quot;parameters&quot;:[0,{&quot;env&quot;:[0,{&quot;enum&quot;:[1,[[0,&quot;dev&quot;],[0,&quot;sit&quot;],[0,&quot;prod&quot;]]],&quot;description&quot;:[0,&quot;Environment to use&quot;]}]}],&quot;id&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;name&quot;:[0,&quot;Inventory Events Channel&quot;],&quot;summary&quot;:[0,&quot;Central event stream for all inventory-related events including stock updates, allocations, and adjustments\n&quot;],&quot;version&quot;:[0,&quot;1.0.0&quot;],&quot;owners&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;dboyne&quot;]}]]],&quot;pathToFile&quot;:[0,&quot;/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/channels/inventory.{env}.events/index.md&quot;]}],&quot;body&quot;:[0,&quot;### Overview\nThe Inventory Events channel is the central stream for all inventory-related events across the system. This includes stock level changes, inventory allocations, adjustments, and stocktake events. Events for a specific SKU are guaranteed to be processed in sequence when using productId as the partition key.\n\n&lt;ChannelInformation /&gt;\n\n### Publishing and Subscribing to Events\n\n#### Publishing Example\n```python\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nbootstrap_servers = [&#39;localhost:9092&#39;]\ntopic = f&#39;inventory.{env}.events&#39;\n\n# Create a Kafka producer\nproducer = KafkaProducer(\n    bootstrap_servers=bootstrap_servers,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Example inventory update event\ninventory_event = {\n    \&quot;eventType\&quot;: \&quot;STOCK_LEVEL_CHANGED\&quot;,\n    \&quot;timestamp\&quot;: datetime.utcnow().isoformat(),\n    \&quot;version\&quot;: \&quot;1.0\&quot;,\n    \&quot;payload\&quot;: {\n        \&quot;productId\&quot;: \&quot;PROD-456\&quot;,\n        \&quot;locationId\&quot;: \&quot;WH-123\&quot;,\n        \&quot;previousQuantity\&quot;: 100,\n        \&quot;newQuantity\&quot;: 95,\n        \&quot;changeReason\&quot;: \&quot;ORDER_FULFILLED\&quot;,\n        \&quot;unitOfMeasure\&quot;: \&quot;EACH\&quot;,\n        \&quot;batchInfo\&quot;: {\n            \&quot;batchId\&quot;: \&quot;BATCH-789\&quot;,\n            \&quot;expiryDate\&quot;: \&quot;2025-12-31\&quot;\n        }\n    },\n    \&quot;metadata\&quot;: {\n        \&quot;source\&quot;: \&quot;warehouse_system\&quot;,\n        \&quot;correlationId\&quot;: \&quot;inv-xyz-123\&quot;,\n        \&quot;userId\&quot;: \&quot;john.doe\&quot;\n    }\n}\n\n# Send the message - using productId as key for partitioning\nproducer.send(\n    topic, \n    key=inventory_event[&#39;payload&#39;][&#39;productId&#39;].encode(&#39;utf-8&#39;),\n    value=inventory_event\n)\nproducer.flush()\n\nprint(f\&quot;Inventory event sent to topic {topic}\&quot;)\n\n```\n\n### Subscription example\n\n```python\nfrom kafka import KafkaConsumer\nimport json\nfrom datetime import datetime\n\nclass InventoryEventConsumer:\n    def __init__(self):\n        # Kafka configuration\n        self.topic = f&#39;inventory.{env}.events&#39;\n        self.consumer = KafkaConsumer(\n            self.topic,\n            bootstrap_servers=[&#39;localhost:9092&#39;],\n            group_id=&#39;inventory-processor-group&#39;,\n            auto_offset_reset=&#39;earliest&#39;,\n            enable_auto_commit=False,\n            value_deserializer=lambda x: json.loads(x.decode(&#39;utf-8&#39;)),\n            key_deserializer=lambda x: x.decode(&#39;utf-8&#39;) if x else None\n        )\n\n    def process_event(self, event):\n        \&quot;\&quot;\&quot;Process individual inventory events based on type\&quot;\&quot;\&quot;\n        event_type = event.get(&#39;eventType&#39;)\n        \n        if event_type == &#39;STOCK_LEVEL_CHANGED&#39;:\n            self.handle_stock_level_change(event)\n        elif event_type == &#39;LOW_STOCK_ALERT&#39;:\n            self.handle_low_stock_alert(event)\n        # Add more event type handlers as needed\n\n    def handle_stock_level_change(self, event):\n        \&quot;\&quot;\&quot;Handle stock level change events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Stock level change detected for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;New quantity: {payload[&#39;newQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def handle_low_stock_alert(self, event):\n        \&quot;\&quot;\&quot;Handle low stock alert events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Low stock alert for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;Current quantity: {payload[&#39;currentQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def start_consuming(self):\n        \&quot;\&quot;\&quot;Start consuming messages from the topic\&quot;\&quot;\&quot;\n        try:\n            print(f\&quot;Starting consumption from topic: {self.topic}\&quot;)\n            for message in self.consumer:\n                try:\n                    # Process the message\n                    event = message.value\n                    print(f\&quot;Received event: {event[&#39;eventType&#39;]} for product: {event[&#39;payload&#39;][&#39;productId&#39;]}\&quot;)\n                    \n                    # Process the event\n                    self.process_event(event)\n                    \n                    # Commit the offset after successful processing\n                    self.consumer.commit()\n                    \n                except Exception as e:\n                    print(f\&quot;Error processing message: {str(e)}\&quot;)\n                    # Implement your error handling logic here\n                    # You might want to send to a DLQ (Dead Letter Queue)\n        \n        except Exception as e:\n            print(f\&quot;Consumer error: {str(e)}\&quot;)\n        finally:\n            # Clean up\n            self.consumer.close()\n\nif __name__ == \&quot;__main__\&quot;:\n    # Create and start the consumer\n    consumer = InventoryEventConsumer()\n    consumer.start_consuming()\n  ```&quot;],&quot;filePath&quot;:[0,&quot;src/content/channels/inventory.{env}.events/index.mdx&quot;],&quot;digest&quot;:[0,&quot;d66c67c215697f32&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;channels&quot;],&quot;slug&quot;:[0,&quot;inventoryenvevents&quot;],&quot;render&quot;:[0,null]}],&quot;target&quot;:[0,{&quot;id&quot;:[0,&quot;NotificationService/index.mdx&quot;],&quot;data&quot;:[0,{&quot;sends&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;OutOfStock&quot;],&quot;version&quot;:[0,&quot;latest&quot;]}],[0,{&quot;id&quot;:[0,&quot;GetInventoryList&quot;],&quot;version&quot;:[0,&quot;0.0.x&quot;]}]]],&quot;receives&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;InventoryAdjusted&quot;],&quot;version&quot;:[0,&quot;&gt;1.0.0&quot;]}],[0,{&quot;id&quot;:[0,&quot;PaymentProcessed&quot;],&quot;version&quot;:[0,&quot;^1.0.0&quot;]}],[0,{&quot;id&quot;:[0,&quot;GetUserNotifications&quot;],&quot;version&quot;:[0,&quot;x&quot;]}],[0,{&quot;id&quot;:[0,&quot;GetNotificationDetails&quot;],&quot;vers tory Adjusted event: {event_data}\&quot;)\n```\n\n&lt;Footer /&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/events/OutOfStock/index.mdx&quot;],&quot;digest&quot;:[0,&quot;88f259eed8aa6f25&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;events&quot;],&quot;slug&quot;:[0,&quot;outofstock&quot;],&quot;render&quot;:[0,null]}],&quot;source&quot;:[0,{&quot;id&quot;:[0,&quot;OutOfStock/index.mdx&quot;],&quot;data&quot;:[0,{&quot;channels&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;version&quot;:[0,&quot;latest&quot;]}]]],&quot;id&quot;:[0,&quot;OutOfStock&quot;],&quot;name&quot;:[0,&quot;Inventory out of stock&quot;],&quot;summary&quot;:[0,&quot;Indicates inventory is out of stock\n&quot;],&quot;version&quot;:[0,&quot;0.0.4&quot;],&quot;badges&quot;:[1,[[0,{&quot;content&quot;:[0,&quot;Recently updated!&quot;],&quot;backgroundColor&quot;:[0,&quot;green&quot;],&quot;textColor&quot;:[0,&quot;green&quot;]}],[0,{&quot;content&quot;:[0,&quot;Channel:Apache Kafka&quot;],&quot;backgroundColor&quot;:[0,&quot;yellow&quot;],&quot;textColor&quot;:[0,&quot;yellow&quot;]}]]],&quot;owners&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;dboyne&quot;]}],[0,{&quot;id&quot;:[0,&quot;msmith&quot;]}],[0,{&quot;id&quot;:[0,&quot;asmith&quot;]}],[0,{&quot;id&quot;:[0,&quot;full-stack&quot;]}],[0,{&quot;id&quot;:[0,&quot;mobile-devs&quot;]}]]],&quot;pathToFile&quot;:[0,&quot;/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/domains/Orders/services/InventoryService/events/OutOfStock/index.md&quot;]}],&quot;body&quot;:[0,&quot;import Footer from &#39;@catalog/components/footer.astro&#39;;\n\n## Overview\n\nThe `Inventory Adjusted` event is triggered whenever there is a change in the inventory levels of a product. This could occur due to various reasons such as receiving new stock, sales, returns, or manual adjustments by the inventory management team. The event ensures that all parts of the system that rely on inventory data are kept up-to-date with the latest inventory levels.\n\n&lt;NodeGraph /&gt;\n\n### Payload\nThe payload of the `Inventory Adjusted` event includes the following fields:\n\n```json title=\&quot;Example of payload\&quot; frame=\&quot;terminal\&quot;\n{\n  \&quot;event_id\&quot;: \&quot;string\&quot;,\n  \&quot;timestamp\&quot;: \&quot;ISO 8601 date-time\&quot;,\n  \&quot;product_id\&quot;: \&quot;string\&quot;,\n  \&quot;adjusted_quantity\&quot;: \&quot;integer\&quot;,\n  \&quot;new_quantity\&quot;: \&quot;integer\&quot;,\n  \&quot;adjustment_reason\&quot;: \&quot;string\&quot;,\n  \&quot;adjusted_by\&quot;: \&quot;string\&quot;\n}\n```\n\n### Producing the Event\n\nTo produce an Inventory Adjusted event, use the following example Kafka producer configuration in Python:\n\n```python title=\&quot;Produce event in Python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nproducer = KafkaProducer(\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Event data\nevent_data = {\n  \&quot;event_id\&quot;: \&quot;abc123\&quot;,\n  \&quot;timestamp\&quot;: datetime.utcnow().isoformat() + &#39;Z&#39;,\n  \&quot;product_id\&quot;: \&quot;prod987\&quot;,\n  \&quot;adjusted_quantity\&quot;: 10,\n  \&quot;new_quantity\&quot;: 150,\n  \&quot;adjustment_reason\&quot;: \&quot;restock\&quot;,\n  \&quot;adjusted_by\&quot;: \&quot;user123\&quot;\n}\n\n# Send event to Kafka topic\nproducer.send(&#39;inventory.adjusted&#39;, event_data)\nproducer.flush()\n```\n\n### Consuming the Event\n\nTo consume an Inventory Adjusted event, use the following example Kafka consumer configuration in Python:\n\n```python title=\&quot;Consuming the event with python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaConsumer\nimport json\n\n# Kafka configuration\nconsumer = KafkaConsumer(\n    &#39;inventory.adjusted&#39;,\n .\n\n&lt;ChannelInformation /&gt;\n\n### Publishing and Subscribing to Events\n\n#### Publishing Example\n```python\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nbootstrap_servers = [&#39;localhost:9092&#39;]\ntopic = f&#39;inventory.{env}.events&#39;\n\n# Create a Kafka producer\nproducer = KafkaProducer(\n    bootstrap_servers=bootstrap_servers,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Example inventory update event\ninventory_event = {\n    \&quot;eventType\&quot;: \&quot;STOCK_LEVEL_CHANGED\&quot;,\n    \&quot;timestamp\&quot;: datetime.utcnow().isoformat(),\n    \&quot;version\&quot;: \&quot;1.0\&quot;,\n    \&quot;payload\&quot;: {\n        \&quot;productId\&quot;: \&quot;PROD-456\&quot;,\n        \&quot;locationId\&quot;: \&quot;WH-123\&quot;,\n        \&quot;previousQuantity\&quot;: 100,\n        \&quot;newQuantity\&quot;: 95,\n        \&quot;changeReason\&quot;: \&quot;ORDER_FULFILLED\&quot;,\n        \&quot;unitOfMeasure\&quot;: \&quot;EACH\&quot;,\n        \&quot;batchInfo\&quot;: {\n            \&quot;batchId\&quot;: \&quot;BATCH-789\&quot;,\n            \&quot;expiryDate\&quot;: \&quot;2025-12-31\&quot;\n        }\n    },\n    \&quot;metadata\&quot;: {\n        \&quot;source\&quot;: \&quot;warehouse_system\&quot;,\n        \&quot;correlationId\&quot;: \&quot;inv-xyz-123\&quot;,\n        \&quot;userId\&quot;: \&quot;john.doe\&quot;\n    }\n}\n\n# Send the message - using productId as key for partitioning\nproducer.send(\n    topic, \n    key=inventory_event[&#39;payload&#39;][&#39;productId&#39;].encode(&#39;utf-8&#39;),\n    value=inventory_event\n)\nproducer.flush()\n\nprint(f\&quot;Inventory event sent to topic {topic}\&quot;)\n\n```\n\n### Subscription example\n\n```python\nfrom kafka import KafkaConsumer\nimport json\nfrom datetime import datetime\n\nclass InventoryEventConsumer:\n    def __init__(self):\n        # Kafka configuration\n        self.topic = topic = f&#39;inventory.{env}.events&#39;\n\n# Create a Kafka producer\nproducer = KafkaProducer(\n    bootstrap_servers=bootstrap_servers,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Example inventory update event\ninventory_event = {\n    \&quot;eventType\&quot;: \&quot;STOCK_LEVEL_CHANGED\&quot;,\n    \&quot;timestamp\&quot;: datetime.utcnow().isoformat(),\n    \&quot;version\&quot;: \&quot;1.0\&quot;,\n    \&quot;payload\&quot;: {\n        \&quot;productId\&quot;: \&quot;PROD-456\&quot;,\n        \&quot;locationId\&quot;: \&quot;WH-123\&quot;,\n        \&quot;previousQuantity\&quot;: 100,\n        \&quot;newQuantity\&quot;: 95,\n        \&quot;changeReason\&quot;: \&quot;ORDER_FULFILLED\&quot;,\n        \&quot;unitOfMeasure\&quot;: \&quot;EACH\&quot;,\n        \&quot;batchInfo\&quot;: {\n            \&quot;batchId\&quot;: \&quot;BATCH-789\&quot;,\n            \&quot;expiryDate\&quot;: \&quot;2025-12-31\&quot;\n        }\n    },\n    \&quot;metadata\&quot;: {\n        \&quot;source\&quot;: \&quot;warehouse_system\&quot;,\n        \&quot;correlationId\&quot;: \&quot;inv-xyz-123\&quot;,\n        \&quot;userId\&quot;: \&quot;john.doe\&quot;\n    }\n}\n\n# Send the message - using productId as key for partitioning\nproducer.send(\n    topic, \n    key=inventory_event[&#39;payload&#39;][&#39;productId&#39;].encode(&#39;utf-8&#39;),\n    value=inventory_event\n)\nproducer.flush()\n\nprint(f\&quot;Inventory event sent to topic {topic}\&quot;)\n\n```\n\n### Subscription example\n\n```python\nfrom kafka import KafkaConsumer\nimport json\nfrom datetime import datetime\n\nclass InventoryEventConsumer:\n    def __init__(self):\n        # Kafka configuration\n        self.topic = f&#39;inventory.{env}.events&#39;\n        self.consumer = KafkaConsumer(\n            self.topic,\n            bootstrap_servers=[&#39;localhost:9092&#39;],\n            group_id=&#39;inventory-processor-group&#39;,\n            auto_offset_reset=&#39;earliest&#39;,\n            enable_auto_commit=False,\n            value_deserializer=lambda x: json.loads(x.decode(&#39;utf-8&#39;)),\n            key_deserializer=lambda x: x.decode(&#39;utf-8&#39;) if x else None\n        )\n\n    def process_event(self, event):\n        \&quot;\&quot;\&quot;Process individual inventory events based on type\&quot;\&quot;\&quot;\n        event_type = event.get(&#39;eventType&#39;)\n        \n        if event_type == &#39;STOCK_LEVEL_CHANGED&#39;:\n            self.handle_stock_level_change(event)\n        elif event_type == &#39;LOW_STOCK_ALERT&#39;:\n            self.handle_low_stock_alert(event)\n        # Add more event type handlers as needed\n\n    def handle_stock_level_change(self, event):\n        \&quot;\&quot;\&quot;Handle stock level change events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Stock level change detected for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;New quantity: {payload[&#39;newQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def handle_low_stock_alert(self, event):\n        \&quot;\&quot;\&quot;Handle low stock alert events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Low stock alert for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;Current quantity: {payload[&#39;currentQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def start_consuming(self):\n        \&quot;\&quot;\&quot;Start consuming messages from the topic\&quot;\&quot;\&quot;\n        try:\n            print(f\&quot;Starting consumption from topic: {self.topic}\&quot;)\n            for message in self.consumer:\n                try:\n                    # Process the message\n                    event = message.value\n                    print(f\&quot;Received event: {event[&#39;eventType&#39;]} for product: {event[&#39;payload&#39;][&#39;productId&#39;]}\&quot;)\n                    \n                    # Process the event\n                    self.process_event(event)\n                    \n                    # Commit the offset after successful processing\n                    self.consumer.commit()\n                    \n                except Exception as e:\n                    print(f\&quot;Error processing message: {str(e)}\&quot;)\n                    # Implement your error handling logic here\n                    # You might want to send to a DLQ (Dead Letter Queue)\n        \n        except Exception as e:\n            print(f\&quot;Consumer error: {str(e)}\&quot;)\n        finally:\n            # Clean up\n            self.consumer.close()\n\nif __name__ == \&quot;__main__\&quot;:\n    # Create and start the consumer\n    consumer = InventoryEventConsumer()\n    consumer.start_consuming()\n  ```&quot;],&quot;filePath&quot;:[0,&quot;src/content/channels/inventory.{env}.events/index.mdx&quot;],&quot;digest&quot;:[0,&quot;d66c67c215697f32&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;channels&quot;],&quot;slug&quot;:[0,&quot;inventoryenvevents&quot;],&quot;render&quot;:[0,null]}],&quot;target&quot;:[0,{&quot;id&quot;:[0,&quot;OutOfStock/index.mdx&quot;],&quot;data&quot;:[0,{&quot;channels&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;version&quot;:[0,&quot;latest&quot;]}]]],&quot;id&quot;:[0,&quot;OutOfStock&quot;],&quot;name&quot;:[0,&quot;Inventory out of stock&quot;],&quot;summary&quot;:[0,&quot;Indicates inventory is out of stock\n&quot;],&quot;version&quot;:[0,&quot;0.0.4&quot;],&quot;badges&quot;:[1,[[0,{&quot;content&quot;:[0,&quot;Recently updated!&quot;],&quot;backgroundColor&quot;:[0,&quot;green&quot;],&quot;textColor&quot;:[0,&quot;green&quot;]}],[0,{&quot;content&quot;:[0,&quot;Channel:Apache Kafka&quot;],&quot;backgroundColor&quot;:[0,&quot;yellow&quot;],&quot;textColor&quot;:[0,&quot;yellow&quot;]}]]],&quot;owners&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;dboyne&quot;]}],[0,{&quot;id&quot;:[0,&quot;msmith&quot;]}],[0,{&quot;id&quot;:[0,&quot;asmith&quot;]}],[0,{&quot;id&quot;:[0,&quot;full-stack&quot;]}],[0,{&quot;id&quot;:[0,&quot;mobile-devs&quot;]}]]],&quot;pathToFile&quot;:[0,&quot;/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/domains/Orders/services/InventoryService/events/OutOfStock/index.md&quot;]}],&quot;body&quot;:[0,&quot;import Footer from &#39;@catalog/components/footer.astro&#39;;\n\n## Overview\n\nThe `Inventory Adjusted` event is triggered whenever there is a change in the inventory levels of a product. This could occur due to various reasons such as receiving new stock, sales, returns, or manual adjustments by the inventory management team. The event ensures that all parts of the system that rely on inventory data are kept up-to-date with the latest inventory levels.\n\n&lt;NodeGraph /&gt;\n\n### Payload\nThe payload of the `Inventory Adjusted` event includes the following fields:\n\n```json title=\&quot;Example of payload\&quot; frame=\&quot;terminal\&quot;\n{\n  \&quot;event_id\&quot;: \&quot;string\&quot;,\n  \&quot;timestamp\&quot;: \&quot;ISO 8601 date-time\&quot;,\n  \&quot;product_id\&quot;: \&quot;string\&quot;,\n  \&quot;adjusted_quantity\&quot;: \&quot;integer\&quot;,\n  \&quot;new_quantity\&quot;: \&quot;integer\&quot;,\n  \&quot;adjustment_reason\&quot;: \&quot;string\&quot;,\n  \&quot;adjusted_by\&quot;: \&quot;string\&quot;\n}\n```\n\n### Producing the Event\n\nTo produce an Inventory Adjusted event, use the following example Kafka producer configuration in Python:\n\n```python title=\&quot;Produce event in Python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nproducer = KafkaProducer(\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Event data\nevent_data = {\n  \&quot;event_id\&quot;: \&quot;abc123\&quot;,\n  \&quot;timestamp\&quot;: datetime.utcnow().isoformat() + &#39;Z&#39;,\n  \&quot;product_id\&quot;: \&quot;prod987\&quot;,\n  \&quot;adjusted_quantity\&quot;: 10,\n  \&quot;new_quantity\&quot;: 150,\n  \&quot;adjustment_reason\&quot;: \&quot;restock\&quot;,\n  \&quot;adjusted_by\&quot;: \&quot;user123\&quot;\n}\n\n# Send event to Kafka topic\nproducer.send(&#39;inventory.adjusted&#39;, event_data)\nproducer.flush()\n```\n\n### Consuming the Event\n\nTo consume an Inventory Adjusted event, use the following example Kafka consumer configuration in Python:\n\n```python title=\&quot;Consuming the event with python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaConsumer\nimport json\n\n# Kafka configuration\nconsumer = KafkaConsumer(\n    &#39;inventory.adjusted&#39;,\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    auto_offset_reset=&#39;earliest&#39;,\n    enable_auto_commit=True,\n    group_id=&#39;inventory_group&#39;,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Consume events\nfor message in consumer:\n    event_data = json.loads(message.value)\n    print(f\&quot;Received Inventory Adjusted event: {event_data}\&quot;)\n```\n\n&lt;Footer /&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/events/OutOfStock/index.mdx&quot;],&quot;digest&quot;:[0,&quot;88f259eed8aa6f25&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;events&quot;],&quot;slug&quot;:[0,&quot;outofstock&quot;],&quot;render&quot;:[0,null]}]}]}],[0,{&quot;label&quot;:[0,&quot;requests&quot;],&quot;animated&quot;:[0,false],&quot;markerEnd&quot;:[0,{&quot;type&quot;:[0,&quot;arrowclosed&quot;],&quot;width&quot;:[0,40],&quot;height&quot;:[0,40]}],&quot;style&quot;:[0,{&quot;strokeWidth&quot;:[0,1]}],&quot;id&quot;:[0,&quot;NotificationService-0.0.2-GetInventoryList-0.0.1&quot;],&quot;source&quot;:[0,&quot;NotificationService-0.0.2&quot;],&quot;target&quot;:[0,&quot;GetInventoryList-0.0.1&quot;],&quot;data&quot;:[0,{ rview\nThe Inventory Events channel is the central stream for all inventory-related events across the system. This includes stock level changes, inventory allocations, adjustments, and stocktake events. Events for a specific SKU are guaranteed to be processed in sequence when using productId as the partition key.\n\n&lt;ChannelInformation /&gt;\n\n### Publishing and Subscribing to Events\n\n#### Publishing Example\n```python\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nbootstrap_servers = [&#39;localhost:9092&#39;]\ntopic = f&#39;inventory.{env}.events&#39;\n\n# Create a Kafka producer\nproducer = KafkaProducer(\n    bootstrap_servers=bootstrap_servers,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Example inventory update event\ninventory_event = {\n    \&quot;eventType\&quot;: \&quot;STOCK_LEVEL_CHANGED\&quot;,\n    \&quot;timestamp\&quot;: datetime.utcnow().isoformat(),\n    \&quot;version\&quot;: \&quot;1.0\&quot;,\n    \&quot;payload\&quot;: {\n        \&quot;productId\&quot;: \&quot;PROD-456\&quot;,\n        \&quot;locationId\&quot;: \&quot;WH-123\&quot;,\n        \&quot;previousQuantity\&quot;: 100,\n        \&quot;newQuantity\&quot;: 95,\n        \&quot;changeReason\&quot;: \&quot;ORDER_FULFILLED\&quot;,\n        \&quot;unitOfMeasure\&quot;: \&quot;EACH\&quot;,\n        \&quot;batchInfo\&quot;: {\n            \&quot;batchId\&quot;: \&quot;BATCH-789\&quot;,\n            \&quot;expiryDate\&quot;: \&quot;2025-12-31\&quot;\n        }\n    },\n    \&quot;metadata\&quot;: {\n        \&quot;source\&quot;: \&quot;warehouse_system\&quot;,\n        \&quot;correlationId\&quot;: \&quot;inv-xyz-123\&quot;,\n        \&quot;userId\&quot;: \&quot;john.doe\&quot;\n    }\n}\n\n# Send the message - using productId as key for partitioning\nproducer.send(\n    topic, \n    key=inventory_event[&#39;payload&#39;][&#39;productId&#39;].encode(&#39;utf-8&#39;),\n    value=inventory_event\n)\nproducer.flush()\n\nprint(f\&quot;Inventory event sent to topic {topic}\&quot;)\n\n```\n\n### Subscription example\n\n```python\nfrom kafka import KafkaConsumer\nimport json\nfrom datetime import datetime\n\nclass InventoryEventConsumer:\n    def __init__(self):\n        # Kafka configuration\n        self.topic = f&#39;inventory.{env}.events&#39;\n        self.consumer = KafkaConsumer(\n            self.topic,\n            bootstrap_servers=[&#39;localhost:9092&#39;],\n            group_id=&#39;inventory-processor-group&#39;,\n            auto_offset_reset=&#39;earliest&#39;,\n            enable_auto_commit=False,\n            value_deserializer=lambda x: json.loads(x.decode(&#39;utf-8&#39;)),\n            key_deserializer=lambda x: x.decode(&#39;utf-8&#39;) if x else None\n        )\n\n    def process_event(self, event):\n        \&quot;\&quot;\&quot;Process individual inventory events based on type\&quot;\&quot;\&quot;\n        event_type = event.get(&#39;eventType&#39;)\n        \n        if event_type == &#39;STOCK_LEVEL_CHANGED&#39;:\n            self.handle_stock_level_change(event)\n        elif event_type == &#39;LOW_STOCK_ALERT&#39;:\n            self.handle_low_stock_alert(event)\n        # Add more event type handlers as needed\n\n    def handle_stock_level_change(self, event):\n        \&quot;\&quot;\&quot;Handle stock level change events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Stock level change detected for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;New quantity: {payload[&#39;newQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def handle_low_stock_alert(self, event):\n        \&quot;\&quot;\&quot;Handle low stock alert events\&quot;\&quot;\&quot;\n        payload = event[&#39;payload&#39;]\n        print(f\&quot;Low stock alert for product {payload[&#39;productId&#39;]}\&quot;)\n        print(f\&quot;Current quantity: {payload[&#39;currentQuantity&#39;]}\&quot;)\n        # Add your business logic here\n\n    def start_consuming(self):\n        \&quot;\&quot;\&quot;Start consuming messages from the topic\&quot;\&quot;\&quot;\n        try:\n            print(f\&quot;Starting consumption from topic: {self.topic}\&quot;)\n            for message in self.consumer:\n                try:\n                    # Process the message\n                    event = message.value\n                    print(f\&quot;Received event: {event[&#39;eventType&#39;]} for product: {event[&#39;payload&#39;][&#39;productId&#39;]}\&quot;)\n                    \n                    # Process the event\n                    self.process_event(event)\n                    \n                    # Commit the offset after successful processing\n                    self.consumer.commit()\n                    \n                except Exception as e:\n                    print(f\&quot;Error processing message: {str(e)}\&quot;)\n                    # Implement your error handling logic here\n                    # You might want to send to a DLQ (Dead Letter Queue)\n        \n        except Exception as e:\n            print(f\&quot;Consumer error: {str(e)}\&quot;)\n        finally:\n            # Clean up\n            self.consumer.close()\n\nif __name__ == \&quot;__main__\&quot;:\n    # Create and start the consumer\n    consumer = InventoryEventConsumer()\n    consumer.start_consuming()\n  ```&quot;],&quot;filePath&quot;:[0,&quot;src/content/channels/inventory.{env}.events/index.mdx&quot;],&quot;digest&quot;:[0,&quot;d66c67c215697f32&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;channels&quot;],&quot;slug&quot;:[0,&quot;inventoryenvevents&quot;],&quot;render&quot;:[0,null]}],&quot;target&quot;:[0,{&quot;id&quot;:[0,&quot;AddInventory/index.mdx&quot;],&quot;data&quot;:[0,{&quot;channels&quot;:[1,[[0,{&quot;parameters&quot;:[0,{&quot;env&quot;:[0,&quot;staging&quot;]}],&quot;id&quot;:[0,&quot;inventory.{env}.events&quot;],&quot;v o be processed in sequence when using productId as the partition key.\n\n&lt;ChannelInformation /&gt;\n\n### Publishing and Subscribing to Events\n\n#### Publishing Example\n```python\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nbootstrap_servers = [&#39;localhost:9092&#39;]\ntopic = f&#39;inventory.{env}.events&#39;\n\n# Create a Kafka producer\nproducer = KafkaProducer(\n    bootstrap_servers=bootstrap_servers,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Example inventory update event\ninventory_event = {\n    \&quot;eventType\&quot;: \&quot;STOCK_LEVEL_CHANGED\&quot;,\n    \&quot;timestamp\&quot;: datetime.utcnow().isoformat(),\n    \&quot;version\&quot;: \&quot;1.0\&quot;,\n    \&quot;payload\&quot;: {\n        \&quot;productId\&quot;: \&quot;PROD-456\&quot;,\n        \&quot;locationId\&quot;: \&quot;WH-123\&quot;,\n        \&quot;previousQuantity\&quot;: 100,\n        \&quot;newQuantity\&quot;: 95,\n        \&quot;changeReason\&quot;: \&quot;ORDER_FULFILLED\&quot;,\n        \&quot;unitOfMeasure\&quot;: \&quot;EACH\&quot;,\n        \&quot;batchInfo\&quot;: {\n            \&quot;batchId\&quot;: \&quot;BATCH-789\&quot;,\n            \&quot;expiryDate\&quot;: \&quot;2025-12-31\&quot;\n        }\n    },\n    \&quot;metadata\&quot;: {\n        \&quot;source\&quot;: \&quot;warehouse_system\&quot;,\n        \&quot;correlationId\&quot;: \&quot;inv-xyz-123\&quot;,\n        \&quot;userId\&quot;: \&quot;john.doe\&quot;\n    }\n}\n\n# Send the message - using productId as key for partitioning\nproducer.send(\n    topic, \n    key=inventory_event[&#39;payload&#39;][&#39;productId&#39;].encode(&#39;utf-8&#39;),\n    value=inventory_event\n)\nproducer.flush()\n\nprint(f\&quot;Inventory event sent to topic {topic}\&quot;)\n\n```\n\n### Subscription example\n\n```python\nfrom kafka import KafkaConsumer\nimport json\nfrom datetime import datetime\n\nclass InventoryEventConsumer:\n    def _
