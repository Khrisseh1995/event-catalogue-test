oduce an Inventory Adjusted event, use the following example Kafka producer configuration in Python:\n\n```python title=\&quot;Produce event in Python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nproducer = KafkaProducer(\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Event data\nevent_data = {\n  \&quot;event_id\&quot;: \&quot;abc123\&quot;,\n  \&quot;timestamp\&quot;: datetime.utcnow().isoformat() + &#39;Z&#39;,\n  \&quot;product_id\&quot;: \&quot;prod987\&quot;,\n  \&quot;adjusted_quantity\&quot;: 10,\n  \&quot;new_quantity\&quot;: 150,\n  \&quot;adjustment_reason\&quot;: \&quot;restock\&quot;,\n  \&quot;adjusted_by\&quot;: \&quot;user123\&quot;\n}\n\n# Send event to Kafka topic\nproducer.send(&#39;inventory.adjusted&#39;, event_data)\nproducer.flush()\n```\n\n### Consuming the Event\n\nTo consume an Inventory Adjusted event, use the following example Kafka consumer configuration in Python:\n\n```python title=\&quot;Consuming the event with python\&quot; frame=\&quot;terminal\&quot;\nfrom kafka import KafkaConsumer\nimport json\n\n# Kafka configuration\nconsumer = KafkaConsumer(\n    &#39;inventory.adjusted&#39;,\n    bootstrap_servers=[&#39;localhost:9092&#39;],\n    auto_offset_reset=&#39;earliest&#39;,\n    enable_auto_commit=True,\n    group_id=&#39;inventory_group&#39;,\n    value_serializer=lambda v: json.dumps(v).encode(&#39;utf-8&#39;)\n)\n\n# Consume events\nfor message in consumer:\n    event_data = json.loads(message.value)\n    print(f\&quot;Received Inventory Adjusted event: {event_data}\&quot;)\n```\n\n&lt;Footer /&gt;&quot;],&quot;filePath&quot;:[0,&quot;src/content/events/InventoryAdjusted/index.mdx&quot;],&quot;digest&quot;:[0,&quot;4fa7f4e32202c86d&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;events&quot;],&quot;slug&quot;:[0,&quot;inventoryad itiated","name":"Payment Initiated","summary":"Event is triggered when a user initiates a payment through the Payment Service","version":"0.0.1","owners":[{"id":"dboyne"}],"pathToFile":"/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/domains/Payment/services/PaymentService/events/PaymentInitiated/index.md"},"body":"import Footer from '@catalog/components/footer.astro';\n\n## Overview\n\nThe Payment Initiated event is triggered when a user initiates a payment through the Payment Service. This event signifies the beginning of the payment process and contains all necessary information to process the payment.\n\n<NodeGraph />\n\n### Payload Example\n\n```json title=\"Payload example\"\n{\n  \"userId\": \"123e4567-e89b-12d3-a456-426614174000\",\n  \"orderId\": \"789e1234-b56c-78d9-e012-3456789fghij\",\n  \"amount\": 100.50,\n  \"paymentMethod\": \"CreditCard\",\n  \"timestamp\": \"2024-07-04T14:48:00Z\"\n}\n```\n\n### Security Considerations\n\n- **Authentication**: Ensure that only authenticated users can initiate a payment, and the userId in the payload matches the authenticated user.\n- **Data Validation**: Validate all input data to prevent injection attacks or other malicious input.\n- **Sensitive Data Handling**: Avoid including sensitive information (e.g., credit card numbers) in the event payload. Use secure channels and encryption for such data.\n\n<Footer />","filePath":"src/content/events/PaymentInitiated/index.mdx","digest":"79bd860592bdaedd","deferredRender":true,"collection":"events","slug":"paymentinitiated"}],"next_steps":["payment_processed","payment_failed"],"type":"message"},{"id":"payment_processed","title":"Payment Processed","message":[{"id":"PaymentProcessed/versioned/0.0.1/index.mdx","data":{"id":"PaymentProcessed","name":"Payment Processed","summary":"Event is triggered after the payment has been successfully processed","version":"0.0.1","owners":[{"id":"dboyne"}],"pathToFile":"/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/domains/Payment/services/PaymentService/events/PaymentProcessed/versioned/0.0.1/index.md"},"body":"import Footer from '@catalog/components/footer.astro';\n\n## Overview\n\nThe PaymentProcessed event is triggered after the payment has been successfully processed by the Payment Service. This event signifies that a payment has been confirmed, and it communicates the outcome to other services and components within the system.\n\n<NodeGraph />\n\n### Payload Example\n\n```json title=\"Payload example\"\n{\n  \"transactionId\": \"123e4567-e89b-12d3-a456-426614174000\",\n  \"userId\": \"123e4567-e89b-12d3-a456-426614174000\",\n  \"orderId\": \"789e1234-b56c-78d9-e012-3456789fghij\",\n  \"amount\": 100.50,\n  \"paymentMethod\": \"CreditCard\",\n  \"status\": \"confirmed\",\n  \"confirmationDetails\": {\n    \"gatewayResponse\": \"Approved\",\n    \"transactionId\": \"abc123\"\n  },\n  \"timestamp\": \"2024-07-04T14:48:00Z\"\n}\n```\n\n### Security Considerations\n\n- **Data Validation**: Ensure that all data in the event payload is validated before publishing to prevent injection attacks or other malicious activities.\n- **Sensitive Data Handling**: Avoid including sensitive information (e.g., full credit card numbers) in the event payload. Use secure channels and encryption for such data.\n- **Authentication and Authorization**: Ensure that only authorized services can publish or consume PaymentProcessed events.\n\n<Footer />","filePath":"src/content/events/PaymentProcessed/versioned/0.0.1/index.mdx","digest":"140d8a82084075cb","deferredRender":true,"collection":"events","slug":"paymentprocessed/versioned/001"}],"next_steps":[{"id":"adjust_inventory","label":"Adjust inventory"},{"id":"send_custom_notification","label":"Notify customer"}],"type":"message"},{"id":"PaymentProcessed/index.mdx","data":{"steps":[{"id":"customer_place_order","title":"Customer places order","next_step":"place_order_request"},{"id":"place_order_request","title":"Place order","message":{"id":"PlaceOrder","version":"0.0.1"},"next_step":{"id":"payment_initiated","label":"Initiate payment"}},{"id":"payment_initiated","title":"Payment Initiated","message":{"id":"PaymentInitiated","version":"0.0.1"},"next_steps":["payment_processed","payment_failed"]},{"id":"payment_processed","title":"Payment Processed","message":{"id":"PaymentProcessed","version":"0.0.1"},"next_steps":[{"id":"adjust_inventory","label":"Adjust inventory"},{"id":"send_custom_notification","label":"Notify customer"}]},{"id":"payment_failed","type":"node","title":"Payment Failed","next_steps":[{"id":"failure_notification","label":"Notify customer of failure"},{"id":"retry_payment","label":"Retry payment"}]},{"id":"adjust_inventory","title":"Inventory Adjusted","message":{"id":"InventoryAdjusted","version":"1.0.1"},"next_step":{"id":"payment_complete","label":"Complete order"}},{"id":"send_custom_notification","type":"node","title":"Customer Notified of Payment","next_step":{"id":"payment_complete","label":"Complete order"}},{"id":"failure_notification","type":"node","title":"Customer Notified of Failure"},{"id":"retry_payment","type":"node","title":"Retry Payment","next_step":{"id":"payment_initiated","label":"Retry payment process"}},{"id":"payment_complete","title":"Payment Complete","message":{"id":"PaymentComplete","version":"0.0.2"},"next_step":{"id":"order-complete","label":"Order completed"}},{"id":"order-complete","type":"node","title":"Order Completed"}],"id":"PaymentFlow","name":"Payment Flow for customers","summary":"Business flow for processing payments in an e-commerce platform","version":"1.0.0","pathToFile":"/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/domains/Payment/flows/PaymentProcessed/index.md","type":"node"},"body":"### Flow of feature\n<NodeGraph/>","filePath":"src/content/flows/PaymentProcessed/index.mdx","digest":"7269fcbb496abc63","deferredRender":true,"collection":"flows","slug":"paymentprocessed"},{"id":"adjust_inventory","title":"Inventory Adjusted","message":[{"id":"InventoryAdjusted/index.mdx","data":{"channels":[{"id":"inventory.{env}.events","version":"latest"}],"id":"InventoryAdjusted","name":"Inventory adjusted","summary":"Indicates a change in inventory level\n","version":"1.0.1","badges":[{"content":"Recently updated!","backgroundColor":"green","textColor":"green"},{"content":"Channel:Apache Kafka","backgroundColor":"yellow","textColor":"yellow"}],"owners":[{"id":"dboyne"},{"id":"msmith"},{"id":"asmith"},{"id":"full-stack"},{"id":"mobile-devs"}],"schemaPath":"schema.avro","pathToFile":"/Users/chrisclark/Development/misc_work_scripts/event-catalogue/my-catalog/domains/Orders/services/InventoryService/events/InventoryAdjusted/index.md"},"body":"import Footer from '@catalog/components/footer.astro';\n\n## Overview\n\nThe `Inventory Adjusted` event is triggered whenever there is a change in the inventory levels of a product. This could occur due to various reasons such as receiving new stock, sales, returns, or manual adjustments by the inventory management team. The event ensures that all parts of the system that rely on inventory data are kept up-to-date with the latest inventory levels.\n\n<Tiles >\n    <Tile icon=\"UserGroupIcon\" href=\"/docs/teams/full-stack\" title=\"Contact the team\" description=\"Any questions? Feel free to contact the owners\" />\n    <Tile icon=\"DocumentIcon\" href={`/generated/events/Inventory/${frontmatter.id}/schema.avro`} title=\"View the schema\" description=\"View the schema directly in your browser\" />\n</Tiles>\n\n## Architecture diagram\n\n<NodeGraph />\n\n<SchemaViewer file=\"schema.json\" title=\"JSON Schema\" maxHeight=\"500\" />\n\n## Payload example\n\nEvent example you my see being published.\n\n```json title=\"Payload example\"\n{\n  \"Name\": \"John Doe\",\n  \"Age\": 30,\n  \"Department\": \"Engineering\",\n  \"Position\": \"Software Engineer\",\n  \"Salary\": 85000.50,\n  \"JoinDate\": \"2024-01-15\"\n}\n```\n\n## Schema (avro)\n\n<Schema file=\"schema.avro\" title=\"Inventory Adjusted Schema (avro)\" />\n\n## Producing the Event\n\nTo produce an Inventory Adjusted event, use the following example Kafka producer configuration in Python:\n\n```python title=\"Produce event in Python\" frame=\"terminal\"\nfrom kafka import KafkaProducer\nimport json\nfrom datetime import datetime\n\n# Kafka configuration\nproducer = KafkaProducer(\n    bootstrap_servers=['localhost:9092'],\n    value_serializer=lambda v: json.dumps(v).encode('utf-8')\n)\n\n# Event data\nevent_data = {\n  \"event_id\": \"abc123\",\n  \"timestamp\": datetime.utcnow().isoformat() + 'Z',\n  \"product_id\": \"prod987\",\n  \"adjusted_quantity\": 10,\n  \"new_quantity\": 150,\n  \"adjustment_reason\": \"restock\",\n  \"adjusted_by\": \"user123\"\n}\n\n# Send event to Kafka topic\nproducer.send('inventory.adjusted', event_data)\nproducer.flush()\n```\n\n### Consuming the Event\n\nTo consume an Inventory Adjusted event, use the following example Kafka consumer configuration in Python:\n\n```python title=\"Consuming the event with python\" frame=\"terminal\"\nfrom kafka import KafkaConsumer\nimport json\n\n# Kafka configuration\nconsumer = KafkaConsumer(\n    'inventory.adjusted',\n    bootstrap_servers=['localhost:9092'],\n    auto_offset_reset='earliest',\n    enable_auto_commit=True,\n    group_id='inventory_group',\n    value_serializer=lambda v: json.dumps(v).encode('utf-8')\n)\n\n# Consume events\nfor message in consumer:\n    event_data = json.loads(message.value)\n    print(f\"Received Inventory Adjusted event: {event_data}\")\n```\n\n<Footer />","filePath":"src/content/events/InventoryAdjusted/index.mdx","digest":"4fa7f4e32202c86d","deferredRender":true,"collection":"events","slug":"inventoryadjusted"}],"next_step":{"id":"payment_complete","label":"Complete order"},"type":"message"},{"id":"PaymentProcessed/index.mdx","data":{"steps":[{"id":"customer_place_order","title":"Customer places order","next_step":"place_or       const elementsToHide = [
        'eventcatalog-vertical-nav',
        'eventcatalog-header',
        'eventcatalog-header-spacer',
        'visualiser-footer',
        // /discover page elements
        'discover-collection-tabs',
        'discover-title',
      ];

      elementsToHide.forEach((id) => {
        const element = document.getElementById(id);
        if (element) element.style.display = 'none';
      });

      content.classList.remove('ml-16');
      return;
    }

    const sidebar = document.getElementById('sidebar');
    const currentPath = window.location.href;

    // Hide the sidebar if the current navigation item is not a sidebar item
    if (!currentNavigationItem.sidebar || currentPath.includes('asyncapi') || currentPath.includes('/spec')) {
      sidebar.style.display = 'none';
      content.style.width = '100%';
      content.classList.add('ml-16');
    } else {
      sidebar.style.display = 'block';
    }

    const navItems = document.querySelectorAll('[data-role="nav-item"]');
    let isOpen = showSideBarOnLoad;

    navItems.forEach((item) => {
      item.addEventListener('click', (e) => {
        const currentPath = window.location.href;
        const id = item.getAttribute('id');

        const navItem = navigationItems.find((navItem) => navItem.id === id);

        if (!navItem.sidebar || !currentPath.includes(navItem.id)) {
          window.location.href = navItem.href;
          return;
        }

        // not on the target page then just go to it.
        if (!currentPath.includes(navItem.id)) return;

        if (currentPath.includes(navItem.id)) {
          e.preventDefault();
          if (isOpen) {
            hideSidebar();
          } else {
            showSidebar();
          }
        }
      });
    });

    function showSidebar() {
      if (!sidebar || !content) return;
      isOpen = true;
      localStorage.setItem('sidebarState', 'open');
      sidebar.style.display = 'block';
      setTimeout(() => {
        sidebar.style.transform = 'translateX(0)';
        content.style.transform = 'translateX(0)';
        content.classList.remove('ml-16');
        content.style.width = 'calc(100% - 240px)';
      }, 10);
    }

    function hideSidebar() {
      if (!sidebar || !content) return;
      isOpen = false;
      sidebar.style.transform = 'translateX(-100%)';
      content.style.transform = 'translateX(0px)';
      content.style.width = '100%';
      content.classList.add('ml-16');
    }

    if (sidebar) {
      sidebar.addEventListener('transitionend', () => {
        if (!isOpen && sidebar && content) {
          sidebar.style.display = 'none';
          content.style.transform = 'translateX(0px)';
        }
      });
    }
  });
})();</script></body></html>
